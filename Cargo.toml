[package]
name = "awqat-core"
version = "1.2.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Small native schedule and alert helper for the Awqat Omarchy plugin"
repository = "https://github.com/iYassr/awqat"

[dependencies]
curl = { version = "0.4", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
